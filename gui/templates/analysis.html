{% extends 'base.html' %}
{% block content %}
<h1>Analysis</h1>
<form method="post" action="{{ url_for('run_analysis') }}">
  <button type="submit" class="btn btn-primary">Run Analysis</button>
</form>
<h3>Recent runs</h3>
<ul>
  {% for r in recent_runs %}
  <li>{{ r.started_at }} — {{ r.status }}</li>
  {% else %}
  <li>No runs</li>
  {% endfor %}
</ul>
{% endblock %}
