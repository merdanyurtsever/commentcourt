{% extends "base.html" %}

{% block title %}{{ t('error.404.title') }} - {{ app_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-muted">404</h1>
    <h2 class="mb-4">{{ t('error.404.title') }}</h2>
    <p class="text-muted mb-4">{{ t('error.404.message') }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="bi bi-house me-1"></i>{{ t('error.back_home') }}
    </a>
</div>
{% endblock %}
